<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CoastGuard AI — Miami Flood Response</title><meta name="description" content="Real-data Miami-Dade coastal flood response dashboard."><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#0a0d12;color:#fff;font-family:Inter,-apple-system,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#243241 0,#111820 38%,#0a0d12 72%)}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#4b9ab01f,transparent 38%),repeating-linear-gradient(25deg,transparent 0 28px,#ffffff03 29px 30px);pointer-events:none}.frame{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:clamp(20px,4vh,42px) clamp(24px,14.4vw,225px) clamp(24px,9vh,74px)}header{height:43px;display:flex;align-items:center;justify-content:space-between;position:relative}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:500}.mark{width:34px;height:34px;border-radius:50%;background:#75a9b8;display:grid;place-items:center}.mark:before{content:"";width:17px;height:17px;border-radius:50%;background:#fff}.mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#151519}.links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:42px}.links a,.cta{color:#fff;text-decoration:none}.links a{font-size:15px}.cta{padding:12px 18px;border-radius:12px;background:linear-gradient(#3d3d3f,#1d1d20);font-size:13px;font-weight:600}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#9dafbb}.hero h1{font-size:clamp(30px,3vw,48px);font-weight:420;letter-spacing:-.02em;text-align:center}.card{width:min(760px,70vw);min-height:152px;border-radius:26px;padding:24px;background:#29292bf4;backdrop-filter:blur(26px);box-shadow:inset 0 0 0 1px #d6e4ff24,0 22px 60px #0006;display:flex;flex-direction:column;justify-content:space-between;gap:24px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status div{padding:10px 12px;border-radius:12px;background:#ffffff0a}.status span{display:block;color:#91959b;font-size:9px;text-transform:uppercase;letter-spacing:.09em}.status strong{display:block;margin-top:4px;font-size:17px}.tools{display:flex;align-items:center;gap:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:30px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;color:#a8aaad;font-size:9px;font-weight:500;background:linear-gradient(#ffffff16,#ffffff0a);border:1px solid #ffffff0d;cursor:pointer}.right{margin-left:auto;display:flex;align-items:center;gap:14px;color:#98999c;font-size:10px;white-space:nowrap}.send{width:35px;height:35px;border:0;border-radius:50%;background:linear-gradient(163deg,#9ec6d1,#4f8797);color:#fff;font-size:16px;cursor:pointer}.proof{display:flex;flex-direction:column;align-items:center;gap:18px;font-size:11px}.proof div{display:flex;gap:52px;font-weight:600}.notice{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:9px;color:#aeb6bb;white-space:nowrap}@media(max-width:1180px){.frame{padding:28px clamp(28px,5vw,60px) 34px}.card{width:min(760px,90vw)}}@media(max-width:599px),(max-height:599px) and (max-width:1180px){.frame{padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}.links{display:none}.hero h1{max-width:12ch;line-height:1.08}.card{width:100%;min-height:auto;padding:16px;border-radius:20px}.status strong{font-size:14px}.chips{max-width:76%}.right span{display:none}.proof div{gap:20px;font-size:10px}}
</style></head><body><div class="stage"><div class="frame"><header><a class="brand" href="#"><span class="mark"></span><span>CoastGuard AI</span></a><nav class="links"><a href="#">Live Map</a><a href="#">Routing</a><a href="#">Assets</a><a href="#">Docs</a></nav><a class="cta" href="#">Miami Ops</a></header><main class="hero"><div class="eyebrow">Miami-Dade Coastal Metro · NAVD88</div><h1>Flood response, in one view.</h1><section class="card"><div class="status"><div><span>Water</span><strong id="water">—</strong></div><div><span>Road segments</span><strong id="roads">—</strong></div><div><span>Critical sites</span><strong id="sites">—</strong></div></div><div class="tools"><div class="chips"><button class="chip">Brickell Core</button><button class="chip">South Beach / MacArthur</button><button class="chip">PortMiami Access</button><button class="chip">Miami River Corridor</button></div><div class="right"><span>Virginia Key · 8723214</span><button class="send" aria-label="Advance forecast">↑</button></div></div></section></main><footer class="proof"><p>Authoritative feeds</p><div><span>USGS 3DEP</span><span>NOAA CO-OPS</span><span>OpenStreetMap</span></div></footer><div class="notice" id="notice"></div></div></div>

const parse=id=>JSON.parse(document.getElementById(id).textContent);const dem=parse('dem-data'),forcing=parse('forcing-data'),roads=parse('roads-data'),landmarks=parse('landmarks-data');let i=0;const render=()=>{const s=forcing.samples[Math.min(i,forcing.samples.length-1)]||{};document.getElementById('water').textContent=Number.isFinite(s.tideM)?`${s.tideM.toFixed(2)} m`:'—';document.getElementById('roads').textContent=roads.features.length.toLocaleString();document.getElementById('sites').textContent=landmarks.features.length;document.getElementById('notice').textContent=dem.data_status==='offline-bootstrap-not-authoritative'?'Offline bootstrap loaded — refresh with npm run generate-data before operational use.':`Data refreshed ${dem.generated_at||''}`};document.querySelector('.send').onclick=()=>{i=(i+1)%Math.max(1,forcing.samples.length);render()};render();
